# Serves the app on the LAN at http://<server>:8088/
# The site folder is mounted read-only, so edits show up without a rebuild.
# (Use `docker build .` instead if you want a self-contained image.)
services:
  botc-companion:
    image: nginx:1.27-alpine
    container_name: botc-companion
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./icons:/usr/share/nginx/html/icons:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
