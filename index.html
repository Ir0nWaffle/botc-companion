<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13100E">
<title>Clocktower Companion</title>
<meta name="description" content="A player's notebook for Blood on the Clocktower: track claims, info, votes and deaths, and get help working out who is lying.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clocktower">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">◷</span> Clocktower<span class="brand-name"> Companion</span></div>
  <div class="phase" id="phase-chip"></div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs">
  <button data-tab="setup"><span class="ti">⚙</span><span>Setup</span></button>
  <button data-tab="town"><span class="ti">◯</span><span>Town</span></button>
  <button data-tab="info"><span class="ti">✎</span><span>Info</span></button>
  <button data-tab="days"><span class="ti">⚖</span><span>Votes</span></button>
  <button data-tab="read"><span class="ti">⚲</span><span>Who's lying?</span></button>
  <button data-tab="guide"><span class="ti">☰</span><span>Guide</span></button>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

<script src="js/icons.js"></script>
<script src="js/extra-characters.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
