<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B10">
<title>Clocktower Companion</title>
<meta name="description" content="A player's notebook for Blood on the Clocktower: track claims, info, votes and deaths, and get help working out who is lying.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clocktower">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="#F2B84B" stroke-width="2"/><path d="M12 6v6l4 3" stroke="#FFD27A" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="#F0625D"/></svg>
    <h1 class="sr-only">Clocktower Companion</h1>
    <span aria-hidden="true">Clocktower<span class="brand-name"> Companion</span></span>
  </div>
  <div class="top-actions">
    <div class="phase" id="phase-chip"></div>
    <button class="icon-btn" data-tab="setup" aria-label="Game setup" title="Game setup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside id="town-pane" aria-label="Town" hidden></aside>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Main">
  <button data-tab="town"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><circle cx="19" cy="9.5" r="2"/><circle cx="16.5" cy="18" r="2"/><circle cx="7.5" cy="18" r="2"/><circle cx="5" cy="9.5" r="2"/></svg><span>Town</span></button>
  <button data-tab="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg><span>Info</span></button>
  <button data-tab="days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 11 3 3 5-6"/><path d="M5 3h14v14l-3 4H8l-3-4V3Z"/></svg><span>Votes</span></button>
  <button data-tab="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.4-4.4M11 8v3.5"/><circle cx="11" cy="14.2" r=".4" fill="currentColor"/></svg><span>Suspects</span></button>
  <button data-tab="bluff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5c2.7 1.3 5.3 1.3 8 0 2.7 1.3 5.3 1.3 8 0v6.2c0 4.6-3.3 7.8-8 9.3-4.7-1.5-8-4.7-8-9.3V5.5Z"/><path d="M7.5 10.5c.8-.7 1.7-.7 2.5 0M14 10.5c.8-.7 1.7-.7 2.5 0M9 15c1.9 1.3 4.1 1.3 6 0"/></svg><span>Bluff</span></button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7.5 4.5 4 4.8v14c3.5-.3 6 .2 8 1.7 2-1.5 4.5-2 8-1.7v-14c-3.5-.3-6 .2-8 1.7ZM12 6.5v14"/></svg><span>Guide</span></button>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" tabindex="-1"></section>
<div class="picker-backdrop" id="picker-backdrop" hidden></div>
<section class="picker" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="picker-title" tabindex="-1"></section>

<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="js/icons.js"></script>
<script src="js/extra-characters.js"></script>
<script src="js/data.js"></script>
<script src="js/coach.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
</script>
</body>
</html>
