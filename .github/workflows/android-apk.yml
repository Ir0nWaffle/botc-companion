name: Android APK

# Builds an installable APK by wrapping the static web app in a Capacitor Android shell.
# Push a tag like v1.0.0 to build and publish a GitHub release with the APK attached,
# or run it by hand from the Actions tab (give a release_tag to create the tag and release, or none for a test build).
#
# Signing: add these repository secrets to sign with your own release key (keep the same key forever,
# Android refuses to update an app signed with a different key):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password (often the same as the keystore password)
# Without them the APK is signed with a throwaway debug key: it installs fine, but a later
# build will not install over it without uninstalling first (which deletes saved games).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create and release, e.g. v1.0.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Work out the version
        id: ver
        run: |
          if [[ "$TAG" == v* ]]; then NAME="${TAG#v}"; else NAME="0.0.0-dev"; fi
          IFS=. read -r MA MI PA <<< "${NAME%%-*}"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          [ "$CODE" -gt 0 ] || CODE=1
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Create the Android project
        working-directory: android-shell
        run: |
          mkdir -p www
          cp -r ../index.html ../manifest.webmanifest ../sw.js ../css ../js ../icons www/
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # App icons from branding/build_icons.py
          cp -r ../branding/android/res/. android/app/src/main/res/
          # Launch screen: the app's dark background and icon instead of Capacitor's placeholder logo
          rm -f android/app/src/main/res/drawable*/splash.png
          cat > android/app/src/main/res/drawable/splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#090B10"/></item>
              <item android:gravity="center"><bitmap android:src="@mipmap/ic_launcher_foreground" android:gravity="center"/></item>
          </layer-list>
          XML
          sed -i 's/^          //' android/app/src/main/res/drawable/splash.xml
          # Version from the tag
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.ver.outputs.code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build
        working-directory: android-shell/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          OUT="$GITHUB_WORKSPACE/clocktower-companion-${{ steps.ver.outputs.name }}.apk"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew --no-daemon assembleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$OUT"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with a debug key."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi
          echo "APK=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: clocktower-companion-${{ steps.ver.outputs.name }}-apk
          path: ${{ env.APK }}

      - name: Publish the release
        if: startsWith(env.TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Android APK for Clocktower Companion $TAG. Download the .apk on your phone and open it (allow installing from this source when asked)."
          if [ "$SIGNING" = debug ]; then NOTE="$NOTE"$'\n\n'"This build is signed with a debug key. A future build signed with a release key will need the app uninstalled first, which deletes games saved in it: use Save game to file before updating."; fi
          # Creates the tag on this commit when it does not exist yet (runs started by hand)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Clocktower Companion $TAG" --notes "$NOTE"
          fi
